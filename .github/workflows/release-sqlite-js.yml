name: Release sqlite-js AAR (manual)

# Publishes the sqlite-js AAR (subprojects/sqlite-js) to the moving sqlite-js-latest release, from
# which dev-assets fetches it into the template that uses it (ADFA-7082).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-sqlite-js
  cancel-in-progress: false

jobs:

  release-sqlite-js:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Check the vendored sqlite-js
        run: subprojects/sqlite-js/vendor.sh --check

      - name: Build the sqlite-js AAR
        run: |
          flox activate -d flox/base -- \
              ./gradlew --console=plain --no-daemon :subprojects:sqlite-js:createSqliteJsAar

      - name: Stage sqlite-js release assets
        run: |
          mkdir -p .release
          cp subprojects/sqlite-js/build/libs/sqlite-js.aar .release/sqlite-js.aar
          ( cd .release && sha256sum sqlite-js.aar > checksums.txt )
          ls -la .release

      # The release is updated in place, never deleted, so dev-assets can always fetch an AAR. If
      # any step of the update fails, the previous assets (downloaded first) and tag are put back.
      - name: Update sqlite-js-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: flox activate -d flox/base -- bash -eo pipefail {0}
        run: |
          TARGET_SHA="$(git rev-parse HEAD)"
          NOTES="built from ${TARGET_SHA} on $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          if ! gh release view sqlite-js-latest >/dev/null 2>&1; then
            gh release create sqlite-js-latest \
                --target "$TARGET_SHA" \
                --latest=false \
                --title "sqlite-js AAR (latest)" \
                --notes "$NOTES" \
                .release/sqlite-js.aar \
                .release/checksums.txt
            exit 0
          fi
          TAG_REF="repos/${GITHUB_REPOSITORY}/git/refs/tags/sqlite-js-latest"
          PREVIOUS_SHA="$(gh api "$TAG_REF" --jq .object.sha)"
          mkdir -p .previous
          # A run that stopped during an upload can leave an asset missing. Back up only the assets
          # that exist: the upload below then replaces the missing ones, so running again repairs it.
          PREVIOUS_ASSETS="$(gh release view sqlite-js-latest --json assets --jq '.assets[].name')"
          for asset in sqlite-js.aar checksums.txt; do
            if grep -qx "$asset" <<<"$PREVIOUS_ASSETS"; then
              gh release download sqlite-js-latest --dir .previous --pattern "$asset"
            fi
          done
          if ! { gh release upload sqlite-js-latest .release/sqlite-js.aar .release/checksums.txt --clobber &&
                 gh api -X PATCH "$TAG_REF" -f sha="$TARGET_SHA" -F force=true >/dev/null &&
                 gh release edit sqlite-js-latest --latest=false --notes "$NOTES"; }; then
            echo "::error::updating sqlite-js-latest failed; putting back the previous assets and tag"
            # each is attempted even if the other fails, since bash -e would stop at the first
            if [ -f .previous/sqlite-js.aar ] && [ -f .previous/checksums.txt ]; then
              gh release upload sqlite-js-latest .previous/sqlite-js.aar .previous/checksums.txt --clobber ||
                echo "::error::could not put back the previous assets"
            else
              echo "::error::the release lacked an asset before this run, so none are put back; run the workflow again"
            fi
            gh api -X PATCH "$TAG_REF" -f sha="$PREVIOUS_SHA" -F force=true >/dev/null ||
              echo "::error::could not put back the tag at $PREVIOUS_SHA"
            exit 1
          fi
