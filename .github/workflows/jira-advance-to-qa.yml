name: Advance Jira Ticket to QA

# Runs on pull_request_review so it can reach the Jira secrets, including for
# pull requests from forks. It must never check out or execute code from the
# pull request. All pull request data is read through github-script's `context`
# rather than `${{ }}` interpolation, so a crafted branch name or title is never
# parsed as source.
on:
  pull_request_review:
    types: [ submitted ]

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve:
    name: Resolve the ticket and check the rest of its pull requests
    runs-on: ubuntu-latest
    # Anyone with read access to a public repo can submit an approving review.
    # Such a review does not satisfy branch protection, but it does fire this
    # event. The association test is only a cheap pre-filter to avoid starting a
    # runner for a drive-by approval; the authorization decision is the
    # effective-permission check in the script. A review can also be submitted
    # against a closed, merged or draft pull request, none of which mean the
    # work is ready for QA.
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.state == 'open' &&
      !github.event.pull_request.draft &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)
    outputs:
      key: ${{ steps.resolve.outputs.key }}
    steps:
      - name: Resolve the ticket key
        id: resolve
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const KEY_PATTERN = /ADFA-\d+/i;

            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const BASE_REPO_ID = context.payload.repository.id;

            if (branch.startsWith('community/')) {
              core.info(`Branch "${branch}" is a community contribution; no Jira ticket to advance.`);
              return;
            }

            /*
             * A fork's head branch is named inside the author's own repository,
             * so its ADFA key is evidence of nothing: a fork branch called
             * "ADFA-1234-crash" would bind an unrelated ticket that a
             * maintainer's approval then walks to QA. External contributions are
             * expected to carry the `community/` prefix and have no ticket of
             * their own in any case.
             */
            if (pr.head.repo?.id !== BASE_REPO_ID) {
              core.info(`Pull request #${pr.number} is from a fork; no Jira ticket to advance.`);
              return;
            }

            // The key comes from the branch rather than the title: a title
            // reading "fixes the ADFA-1234 crash" would otherwise pick the ticket
            // that moves. debug.yml extracts from the branch alone for the same
            // reason.
            const match = branch.match(KEY_PATTERN);
            if (!match) {
              core.info(`No ADFA ticket referenced by branch "${branch}"; nothing to do.`);
              return;
            }
            const key = match[0].toUpperCase();

            /*
             * author_association does not prove write access: an org member may
             * have no access to this repo, and a collaborator may be read-only.
             * Ask for the effective permission instead, once per login, since the
             * same reviewer usually appears on every branch of a stack.
             */
            const permissions = new Map();
            const canMerge = async login => {
              if (!permissions.has(login)) {
                let permission;
                try {
                  const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    username: login,
                  });
                  permission = data.permission;
                } catch (error) {
                  /*
                   * A 404 answers the question with "no access" -- App bots review
                   * too, and a "name[bot]" login is not a username. Anything else
                   * is a broken automation rather than a verdict: the token cannot
                   * read collaborators, and every later approval would end as a
                   * warning under a green check, which is the silent drift this
                   * job exists to remove. Let it out to the catch below and turn
                   * the run red.
                   */
                  if (error.status !== 404) {
                    throw new Error(`could not read ${login}'s permission on this repository (${error.message})`);
                  }
                  permission = 'none';
                }
                permissions.set(login, permission);
              }
              /*
               * The legacy `permission` field reports "maintain" as "write", so
               * those two values cover admin, maintain and write.
               */
              return ['admin', 'write'].includes(permissions.get(login));
            };

            const reviewer = context.payload.review.user.login;

            try {
              if (!await canMerge(reviewer)) {
                core.info(`${reviewer} has "${permissions.get(reviewer)}" permission and cannot merge; leaving ${key} untouched.`);
                return;
              }

              /*
               * One ticket can own a stack of pull requests. Moving it on the
               * first approval hands QA a ticket whose code is four branches from
               * landing, and the later approvals then find it already at QA and
               * say nothing. Advance only once every open pull request carrying
               * this key -- the one that fired this event included -- is approved
               * with no change request outstanding.
               */
              const open = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              /*
               * Fork heads are excluded for the reason given above, and because a
               * stranger could otherwise hold the board still by opening a fork
               * branch named after someone else's ticket.
               */
              const stack = open.filter(candidate => {
                if (candidate.head.repo?.id !== BASE_REPO_ID) return false;
                const candidateKey = candidate.head.ref.match(KEY_PATTERN);
                return candidateKey && candidateKey[0].toUpperCase() === key;
              });
              if (!stack.some(member => member.number === pr.number)) {
                stack.push(pr);
              }

              for (const member of stack) {
                const label = member.number === pr.number
                  ? `this pull request (#${member.number})`
                  : `pull request #${member.number}`;

                if (member.draft) {
                  core.info(`${key}: ${label} is a draft; leaving the ticket where it is.`);
                  return;
                }

                const reviews = await github.paginate(github.rest.pulls.listReviews, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: member.number,
                  per_page: 100,
                });

                /*
                 * A reviewer's verdict is their latest non-comment review, and
                 * only the verdicts of people who could merge count: anyone can
                 * review a public repo, so counting everyone would let a drive-by
                 * approval satisfy this gate and a drive-by change request hold
                 * the board still.
                 */
                const verdicts = new Map();
                for (const submitted of reviews) {
                  if (submitted.state === 'COMMENTED' || submitted.state === 'PENDING') continue;
                  if (!submitted.user || !await canMerge(submitted.user.login)) continue;
                  verdicts.set(submitted.user.login, submitted.state);
                }
                /*
                 * The review that fired this event is the newest verdict of the
                 * reviewer who submitted it; listReviews need not show it yet.
                 */
                if (member.number === pr.number) {
                  verdicts.set(reviewer, 'APPROVED');
                }

                const states = [...verdicts.values()];
                if (states.includes('CHANGES_REQUESTED')) {
                  core.info(`${key}: ${label} has an outstanding change request; leaving the ticket where it is.`);
                  return;
                }
                if (!states.includes('APPROVED')) {
                  core.info(`${key}: ${label} is not approved; leaving the ticket where it is.`);
                  return;
                }
              }

              core.setOutput('key', key);
            } catch (error) {
              core.setFailed(`Cannot decide whether ${key} may advance: ${error.message}. Leaving it untouched.`);
            }

  advance:
    name: Move linked Jira ticket to QA
    runs-on: ubuntu-latest
    needs: resolve
    if: needs.resolve.outputs.key != ''
    # Two approvals landing seconds apart otherwise run two walks over one
    # ticket. Backward transitions are global in this Jira workflow, so a stale
    # walk can pull a ticket back out of QA. The group has to key on the ticket,
    # not the pull request: a stack shares one ticket across several of them.
    concurrency:
      group: jira-advance-${{ needs.resolve.outputs.key }}
      cancel-in-progress: false
    steps:
      - name: Walk the ticket forward to QA
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET_KEY: ${{ needs.resolve.outputs.key }}
        with:
          script: |
            const JIRA_BASE = 'https://appdevforall.atlassian.net';

            // Node's fetch imposes no deadline on a response, so a hung or
            // half-delivered reply would stall the job rather than fail it.
            // Aborting routes it into the catch below, where it stays a warning.
            const JIRA_REQUEST_TIMEOUT_MS = 30000;

            // Case-sensitive, in board order. Note the lowercase "review" and
            // "merge" -- Jira matches these exactly.
            const STATUSES = ['To Do', 'In Progress', 'Code review', 'QA', 'Ready to merge', 'Done'];
            const TARGET = 'QA';
            const TARGET_INDEX = STATUSES.indexOf(TARGET);

            const pr = context.payload.pull_request;
            const reviewer = context.payload.review.user.login;
            const key = process.env.TICKET_KEY;

            const email = process.env.JIRA_EMAIL;
            const token = process.env.JIRA_API_TOKEN;
            if (!email || !token) {
              core.warning(`Jira credentials are not configured; leaving ${key} untouched.`);
              return;
            }
            const auth = 'Basic ' + Buffer.from(`${email}:${token}`).toString('base64');

            const jira = async (path, init = {}) => {
              const response = await fetch(`${JIRA_BASE}/rest/api/3${path}`, {
                ...init,
                headers: {
                  Authorization: auth,
                  Accept: 'application/json',
                  ...(init.body ? { 'Content-Type': 'application/json' } : {}),
                },
                signal: AbortSignal.timeout(JIRA_REQUEST_TIMEOUT_MS),
              });
              if (!response.ok) {
                throw new Error(`${init.method || 'GET'} ${path} returned HTTP ${response.status}`);
              }
              return response.status === 204 ? null : response.json();
            };

            const statusOf = async () => (await jira(`/issue/${key}?fields=status`)).fields.status.name;

            /*
             * Declared outside the try so the catch can report how far the walk
             * got. A hop is committed as it is made and there is no rollback, so
             * a failure part-way leaves the ticket somewhere new, and a log line
             * claiming it did not move sends whoever repairs the board to the
             * wrong place.
             */
            let current = null;
            const walked = [];

            const trailSuffix = () => {
              if (walked.length <= 1) return ' The ticket was not moved.';
              return ` It was moved ${walked.join(' -> ')} and is now at "${current}"; finish it by hand.`;
            };

            try {
              current = await statusOf();
              walked.push(current);
              let index = STATUSES.indexOf(current);

              if (index === -1) {
                core.warning(`${key} is in unrecognized status "${current}"; leaving it untouched.`);
                return;
              }
              if (index >= TARGET_INDEX) {
                core.info(`${key} is already at "${current}", which is at or past ${TARGET}; nothing to do.`);
                return;
              }

              /*
               * There is no direct edge from "To Do" or "In Progress" to QA, so a
               * ticket left behind has to be walked forward one hop at a time --
               * the ticket that is behind belongs to the person who forgot.
               * Backward transitions, by contrast, are global from every status,
               * which is why each hop re-reads the ticket first: a walk that
               * blindly asks for the next status can drag a ticket that someone
               * else already advanced back down the board.
               */
              while (index < TARGET_INDEX) {
                const observed = await statusOf();
                if (observed !== current) {
                  core.warning(
                    `${key} moved to "${observed}" while this run was walking it from "${current}"; ` +
                    `something else is moving the same ticket. Stopping.${trailSuffix()}`
                  );
                  return;
                }

                const next = STATUSES[index + 1];
                const { transitions } = await jira(`/issue/${key}/transitions`);
                const hop = transitions.find(transition => transition.to && transition.to.name === next);

                if (!hop) {
                  const offered = transitions
                    .map(transition => transition.to && transition.to.name)
                    .filter(Boolean)
                    .join(', ');
                  core.warning(
                    `${key} is in "${current}" and offers no transition to "${next}" (available: ${offered}). ` +
                    `Stopping here.${trailSuffix()}`
                  );
                  return;
                }

                await jira(`/issue/${key}/transitions`, {
                  method: 'POST',
                  body: JSON.stringify({ transition: { id: hop.id } }),
                });

                current = next;
                index += 1;
                walked.push(current);
              }

              const trail = walked.join(' -> ');

              /*
               * The walk is already committed by this point, so a comment that
               * fails to post must not be reported as a failure to advance: that
               * sends whoever reads the log to a ticket already sitting where it
               * belongs.
               */
              try {
                await jira(`/issue/${key}/comment`, {
                  method: 'POST',
                  body: JSON.stringify({
                    body: {
                      type: 'doc',
                      version: 1,
                      content: [{
                        type: 'paragraph',
                        content: [
                          { type: 'text', text: `Automatically moved to ${TARGET} (${trail}): ` },
                          {
                            type: 'text',
                            text: `pull request #${pr.number}`,
                            marks: [{ type: 'link', attrs: { href: pr.html_url } }],
                          },
                          { type: 'text', text: ` was approved by ${reviewer}.` },
                        ],
                      }],
                    },
                  }),
                });
              } catch (error) {
                core.warning(`${key} reached ${TARGET} (${trail}), but the Jira comment recording why could not be posted: ${error.message}.`);
              }

              core.info(`${key}: ${trail}`);
              core.summary.addRaw(`Moved [${key}](${JIRA_BASE}/browse/${key}) to ${TARGET}: ${trail}`);
              await core.summary.write();
            } catch (error) {
              // A Jira outage or auth problem must never turn a pull request red.
              core.warning(`Could not advance ${key} to ${TARGET}: ${error.message}.${trailSuffix()}`);
            }
